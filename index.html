<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Dash</title>
  <style>
    /* =========================================
       ESTILOS GENERALES
       ========================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #07071a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Título animado */
    #title {
      color: #fff;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 18px #00f0ff, 0 0 40px #00f0ff44;
      animation: titlePulse 2.5s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 18px #00f0ff, 0 0 40px #00f0ff44; }
      50%       { text-shadow: 0 0 30px #00f0ff, 0 0 70px #00f0ffaa; }
    }

    /* Contenedor del canvas con efecto de borde brillante */
    #game-container {
      position: relative;
      border: 2px solid #00f0ff33;
      border-radius: 6px;
      box-shadow: 0 0 40px #00f0ff22, 0 0 80px #0033ff11;
    }

    canvas {
      display: block;
      border-radius: 4px;
    }

    /* HUD (marcador) */
    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 8px 2px;
    }

    .hud-item {
      color: #ffffffaa;
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hud-item span {
      color: #00f0ff;
      font-weight: 700;
    }

    /* Instrucciones */
    #instructions {
      color: #ffffff33;
      font-size: 0.7rem;
      letter-spacing: 2px;
      margin-top: 9px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="title">Geometry Dash</div>

  <div id="hud">
    <div class="hud-item">Puntos: <span id="score-display">0</span></div>
    <div class="hud-item">Mejor: <span id="best-display">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="380"></canvas>
  </div>

  <div id="instructions">Espacio / Tap para saltar</div>

  <script>
    // =========================================
    // REFERENCIAS AL CANVAS
    // =========================================
    const canvas  = document.getElementById('gameCanvas');
    const ctx     = canvas.getContext('2d');
    const $score  = document.getElementById('score-display');
    const $best   = document.getElementById('best-display');

    // =========================================
    // CONSTANTES GLOBALES
    // =========================================
    const GROUND_Y            = canvas.height - 70; // Y del suelo
    const GRAVITY             = 0.62;
    const JUMP_FORCE          = -13.8;
    const GAME_SPEED_INIT     = 5.2;
    const SPEED_INCREMENT     = 0.0009;  // Aceleración progresiva
    const OBS_INTERVAL_MIN    = 62;
    const OBS_INTERVAL_MAX    = 125;
    const PLAYER_SIZE         = 38;
    const PLAYER_X            = 110;     // Posición horizontal fija del cubo

    // Paleta de colores estilo GD
    const C = {
      sky1          : '#08081c',
      sky2          : '#181840',
      groundFill    : '#0d0d28',
      groundLine    : '#00f0ff',
      playerFill    : '#00e5ff',
      playerInner   : 'rgba(255,255,255,0.22)',
      playerGlow    : '#00f0ff',
      triColor1     : '#ff1a3c',
      triColor2     : '#ff6e84',
      triGlow       : '#ff003c',
      gridLine      : 'rgba(0,240,255,0.045)',
      particles     : ['#00f0ff','#ff3c5f','#ffe600','#bf5af2','#30d158'],
    };

    // =========================================
    // ESTADO DEL JUEGO
    // =========================================
    let state         = 'running'; // 'running' | 'dead'
    let score         = 0;
    let bestScore     = 0;
    let gameSpeed     = GAME_SPEED_INIT;
    let frameCount    = 0;
    let nextObsIn     = 80;
    let bgOffset      = 0;
    let deathTimer    = 0;
    const DEATH_PAUSE = 75; // Frames de pausa antes de mostrar la pantalla de Game Over

    // =========================================
    // JUGADOR
    // =========================================
    const player = {
      x        : PLAYER_X,
      y        : GROUND_Y - PLAYER_SIZE,
      vy       : 0,
      onGround : true,
      alive    : true,
      rotation : 0,

      update() {
        if (!this.alive) return;

        // Aplicar gravedad
        this.vy += GRAVITY;
        this.y  += this.vy;

        // Colisión con el suelo
        if (this.y >= GROUND_Y - PLAYER_SIZE) {
          this.y       = GROUND_Y - PLAYER_SIZE;
          this.vy      = 0;
          this.onGround = true;
        } else {
          this.onGround = false;
        }

        // Rotación del cubo en el aire; alineación al llegar al suelo
        if (!this.onGround) {
          this.rotation += 0.095;
        } else {
          const step = Math.PI / 2;
          this.rotation = Math.round(this.rotation / step) * step;
        }
      },

      jump() {
        if (this.onGround && this.alive) {
          this.vy       = JUMP_FORCE;
          this.onGround = false;
          spawnJumpParticles();
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x + PLAYER_SIZE / 2, this.y + PLAYER_SIZE / 2);
        ctx.rotate(this.rotation);

        // Glow exterior
        ctx.shadowBlur  = 20;
        ctx.shadowColor = C.playerGlow;

        // Cuerpo del cubo
        ctx.fillStyle = C.playerFill;
        ctx.fillRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);

        // Borde blanco
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth   = 2;
        ctx.strokeRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);

        // Detalle interior (cuadrado pequeño centrado)
        ctx.shadowBlur  = 0;
        ctx.fillStyle   = C.playerInner;
        const inner = PLAYER_SIZE * 0.38;
        ctx.fillRect(-inner / 2, -inner / 2, inner, inner);

        ctx.restore();
      }
    };

    // =========================================
    // OBSTÁCULOS (triángulos)
    // =========================================
    let obstacles = [];

    // Genera uno o dos triángulos consecutivos
    function spawnObstacle() {
      const double = Math.random() < 0.28; // 28 % de probabilidad de doble triángulo
      const triW   = 46;
      const triH   = 52;

      obstacles.push({ x: canvas.width + 30, triW, triH });
      if (double) {
        obstacles.push({ x: canvas.width + 30 + triW + 8, triW, triH });
      }
    }

    // Dibuja un triángulo individual con glow degradado
    function drawTriangle(x, triW, triH) {
      const baseY = GROUND_Y;
      const tipY  = GROUND_Y - triH;
      const tipX  = x + triW / 2;

      ctx.save();
      ctx.shadowBlur  = 18;
      ctx.shadowColor = C.triGlow;

      const grad = ctx.createLinearGradient(x, baseY, tipX, tipY);
      grad.addColorStop(0, C.triColor1);
      grad.addColorStop(1, C.triColor2);
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(x + triW, baseY);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#ff8fa0';
      ctx.lineWidth   = 1.5;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function updateObstacles() {
      for (const obs of obstacles) obs.x -= gameSpeed;
      obstacles = obstacles.filter(obs => obs.x + obs.triW > -30);

      nextObsIn--;
      if (nextObsIn <= 0) {
        spawnObstacle();
        nextObsIn = Math.floor(Math.random() * (OBS_INTERVAL_MAX - OBS_INTERVAL_MIN) + OBS_INTERVAL_MIN);
      }
    }

    function drawObstacles() {
      for (const obs of obstacles) drawTriangle(obs.x, obs.triW, obs.triH);
    }

    // =========================================
    // DETECCIÓN DE COLISIONES
    // Usa hitbox reducida (margen interior) para un gameplay más justo
    // =========================================
    function checkCollisions() {
      const margin = 5;
      const px = player.x + margin;
      const py = player.y + margin;
      const pw = PLAYER_SIZE - margin * 2;
      const ph = PLAYER_SIZE - margin * 2;

      for (const obs of obstacles) {
        const { triW, triH } = obs;
        const baseY = GROUND_Y;
        const tipX  = obs.x + triW / 2;
        const tipY  = baseY - triH;

        // Descarte rápido con bounding box
        if (px + pw < obs.x || px > obs.x + triW) continue;
        if (py + ph < tipY  || py > baseY)         continue;

        // Comprobar esquinas del cubo contra el triángulo
        const corners = [
          { x: px,      y: py + ph },
          { x: px + pw, y: py + ph },
          { x: px,      y: py + ph * 0.6 },
          { x: px + pw, y: py + ph * 0.6 },
        ];

        for (const c of corners) {
          if (pointInTriangle(c.x, c.y, obs.x, baseY, tipX, tipY, obs.x + triW, baseY)) {
            return true;
          }
        }
      }
      return false;
    }

    // Comprueba si un punto está dentro de un triángulo (signo de área)
    function sign(p1x, p1y, p2x, p2y, p3x, p3y) {
      return (p1x - p3x) * (p2y - p3y) - (p2x - p3x) * (p1y - p3y);
    }

    function pointInTriangle(px, py, ax, ay, bx, by, cx, cy) {
      const d1 = sign(px, py, ax, ay, bx, by);
      const d2 = sign(px, py, bx, by, cx, cy);
      const d3 = sign(px, py, cx, cy, ax, ay);
      return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
    }

    // =========================================
    // PARTÍCULAS
    // =========================================
    let particles = [];

    function spawnDeathParticles() {
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        particles.push({
          x     : player.x + PLAYER_SIZE / 2,
          y     : player.y + PLAYER_SIZE / 2,
          vx    : Math.cos(angle) * speed,
          vy    : Math.sin(angle) * speed - 2.5,
          alpha : 1,
          size  : Math.random() * 9 + 3,
          color : C.particles[Math.floor(Math.random() * C.particles.length)],
          death : true,
        });
      }
    }

    function spawnJumpParticles() {
      for (let i = 0; i < 7; i++) {
        particles.push({
          x     : player.x + Math.random() * PLAYER_SIZE,
          y     : player.y + PLAYER_SIZE,
          vx    : (Math.random() - 0.5) * 3,
          vy    : -(Math.random() * 3 + 1),
          alpha : 0.75,
          size  : Math.random() * 5 + 2,
          color : C.playerGlow,
          death : false,
        });
      }
    }

    function updateParticles() {
      for (const p of particles) {
        p.x    += p.vx;
        p.y    += p.vy;
        p.vy   += 0.18;
        p.alpha -= p.death ? 0.022 : 0.055;
      }
      particles = particles.filter(p => p.alpha > 0);
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha  = p.alpha;
        ctx.fillStyle    = p.color;
        ctx.shadowBlur   = 10;
        ctx.shadowColor  = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
      }
    }

    // =========================================
    // ESTRELLAS (efecto parallax)
    // =========================================
    const stars = Array.from({ length: 90 }, () => ({
      x     : Math.random() * canvas.width,
      y     : Math.random() * GROUND_Y * 0.88,
      size  : Math.random() * 1.7 + 0.2,
      speed : Math.random() * 0.9 + 0.15,
      alpha : Math.random() * 0.65 + 0.25,
    }));

    // =========================================
    // RENDERIZADO DEL FONDO Y SUELO
    // =========================================
    function drawBackground() {
      // Degradado de cielo
      const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      grad.addColorStop(0, C.sky1);
      grad.addColorStop(1, C.sky2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cuadrícula de profundidad
      ctx.strokeStyle = C.gridLine;
      ctx.lineWidth   = 1;
      const gs = 50;
      for (let x = bgOffset % gs; x < canvas.width; x += gs) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, GROUND_Y);
        ctx.stroke();
      }

      // Estrellas con parallax
      for (const s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle   = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.x -= s.speed * (gameSpeed / GAME_SPEED_INIT);
        if (s.x < 0) s.x = canvas.width;
      }
      ctx.globalAlpha = 1;
    }

    function drawGround() {
      // Bloque de suelo
      ctx.fillStyle = C.groundFill;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // Línea superior con glow
      ctx.strokeStyle = C.groundLine;
      ctx.lineWidth   = 2;
      ctx.shadowBlur  = 12;
      ctx.shadowColor = C.groundLine;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Líneas de loseta en el suelo
      ctx.strokeStyle = 'rgba(0,240,255,0.07)';
      ctx.lineWidth   = 1;
      const tile = 40;
      const off  = bgOffset % tile;
      for (let x = -off; x < canvas.width; x += tile) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
    }

    // =========================================
    // PANTALLA DE GAME OVER
    // =========================================
    function drawDeathScreen() {
      if (deathTimer < DEATH_PAUSE) return;

      // Overlay oscuro
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';

      // Título "GAME OVER"
      ctx.font        = 'bold 54px Segoe UI';
      ctx.fillStyle   = '#ff3c5f';
      ctx.shadowColor = '#ff003c';
      ctx.shadowBlur  = 24;
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 44);

      // Puntuaciones
      ctx.font        = 'bold 20px Segoe UI';
      ctx.fillStyle   = '#ffffff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur  = 10;
      ctx.fillText(`Puntos: ${score}`,       canvas.width / 2, canvas.height / 2 + 8);
      ctx.fillText(`Mejor marca: ${bestScore}`, canvas.width / 2, canvas.height / 2 + 38);

      // Botón de reinicio
      const bw = 210, bh = 50;
      const bx = canvas.width / 2 - bw / 2;
      const by = canvas.height / 2 + 62;

      ctx.shadowBlur  = 18;
      ctx.shadowColor = '#00f0ff';
      ctx.fillStyle   = '#00e5ff';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 9);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle  = '#07071a';
      ctx.font       = 'bold 18px Segoe UI';
      ctx.fillText('REINTENTAR', canvas.width / 2, by + 33);

      ctx.textAlign = 'left';
      ctx.shadowBlur = 0;
    }

    // =========================================
    // CONTROLES: TECLADO Y RATÓN / TÁCTIL
    // =========================================
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); handleInput(null); }
    });

    canvas.addEventListener('click', e => {
      if (state === 'dead' && deathTimer >= DEATH_PAUSE) {
        // Comprobar clic en botón de reinicio
        const r  = canvas.getBoundingClientRect();
        const cx = e.clientX - r.left;
        const cy = e.clientY - r.top;
        const bw = 210, bh = 50;
        const bx = canvas.width / 2 - bw / 2;
        const by = canvas.height / 2 + 62;
        if (cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh) {
          resetGame(); return;
        }
      }
      handleInput(null);
    });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      handleInput(null);
    }, { passive: false });

    function handleInput() {
      if (state === 'running')                            player.jump();
      else if (state === 'dead' && deathTimer >= DEATH_PAUSE) resetGame();
    }

    // =========================================
    // REINICIO
    // =========================================
    function resetGame() {
      player.x        = PLAYER_X;
      player.y        = GROUND_Y - PLAYER_SIZE;
      player.vy       = 0;
      player.onGround = true;
      player.alive    = true;
      player.rotation = 0;

      obstacles  = [];
      particles  = [];
      score      = 0;
      frameCount = 0;
      gameSpeed  = GAME_SPEED_INIT;
      nextObsIn  = 80;
      deathTimer = 0;
      state      = 'running';

      $score.textContent = '0';
    }

    // =========================================
    // BUCLE PRINCIPAL
    // =========================================
    function gameLoop() {
      // --- Actualización ---
      if (state === 'running') {
        frameCount++;
        bgOffset  += gameSpeed;
        gameSpeed += SPEED_INCREMENT;

        player.update();
        updateObstacles();
        updateParticles();

        score = Math.floor(frameCount / 6);
        $score.textContent = score;

        // Comprobar colisión con obstáculos
        if (checkCollisions()) {
          player.alive = false;
          state        = 'dead';
          deathTimer   = 0;
          if (score > bestScore) {
            bestScore = score;
            $best.textContent = bestScore;
          }
          spawnDeathParticles();
        }

      } else if (state === 'dead') {
        deathTimer++;
        bgOffset += 0.8; // El fondo sigue deslizándose suavemente
        updateParticles();
      }

      // --- Renderizado ---
      drawBackground();
      drawGround();
      drawParticles();
      drawObstacles();
      if (player.alive) player.draw();
      if (state === 'dead') drawDeathScreen();

      requestAnimationFrame(gameLoop);
    }

    // =========================================
    // ARRANQUE
    // =========================================
    gameLoop();
  </script>
</body>
</html>
